name: CI/CD to GitHub Pages

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Lint, Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      # بیلد یکسان برای هر دو برنچ (مستقیماً در مسیر اصلی /GEO/)
      - name: Build project
        env:
          VITE_BASE_PATH: /GEO/
        run: pnpm build

      # ساخت فایل 404.html برای جلوگیری از خطا هنگام رفرش صفحات توسط مشتری
      - name: Create 404.html for SPA Routing
        if: github.event_name == 'push'
        run: cp dist/index.html dist/404.html

      # انتشار مستقیم در ریشه اصلی سایت
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

