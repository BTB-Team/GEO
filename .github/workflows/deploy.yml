name: CI/CD to GitHub Pages

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Lint, Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      # بیلد برای برنچ main (آدرس اصلی: username.github.io/GEO/)
      - name: Build for Production (main)
        if: github.ref == 'refs/heads/main'
        env:
          VITE_BASE_PATH: /GEO/
        run: pnpm build

      # بیلد برای برنچ develop (آدرس تست: username.github.io/GEO/dev/)
      - name: Build for Staging (develop)
        if: github.ref == 'refs/heads/develop'
        env:
          VITE_BASE_PATH: /GEO/dev/
        run: pnpm build

      # ساخت 404.html برای جلوگیری از خطا هنگام رفرش صفحات داخلی
      - name: Create 404.html for SPA Routing
        if: github.event_name == 'push'
        run: cp dist/index.html dist/404.html

      # دیپلوی روی برنچ gh-pages
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ github.ref == 'refs/heads/develop' && 'dev' || '' }}
          keep_files: true
